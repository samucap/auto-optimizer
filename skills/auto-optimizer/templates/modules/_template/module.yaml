name: _template
version: 1
objective_type: code_improvement
topic: |
  Improve the pure function sandbox/score.py so the primary metric (score_sum)
  is maximized on the fixture inputs without editing the eval harness.
goal: |
  Maximize score_sum on fixtures/cases.json while keeping correctness == 1.0.
deliverables:
  - type: code_diff
    paths:
      - sandbox/score.py
files_to_edit:
  - sandbox/score.py
files_forbidden:
  - eval.py
  - fixtures/**
metrics:
  primary: score_sum
  direction: maximize
  secondary:
    - name: correctness
      direction: maximize
      min_value: 1.0
budgets:
  max_cycles: 10
  max_reviewer_iterations: 2
  max_architect_candidates: 3
  max_executor_candidates: 2
  max_wall_time_minutes: 60
eval:
  # module-local eval.py is used automatically when present
  timeout_seconds: 60
  retries: 2
stages:
  researcher:
    enabled: true
    web: true
    min_sources: 1
  analyst:
    enabled: true
  architect:
    enabled: true
    candidates: 3
  reviewer:
    enabled: true
    adversarial: true
  executor:
    enabled: true
    candidates: 2
anti_reward_hacking:
  forbid_edit_globs:
    - eval.py
    - fixtures/**
  detect:
    - deleted_tests
    - hardcoded_metric_constants
    - eval_harness_mutation
keep_policy:
  require_primary_improved: true
  require_secondary_gates: true
  on_tie: keep_baseline
sources: []
source_paths:
  - sandbox/score.py
